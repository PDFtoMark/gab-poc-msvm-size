name: Binary Size Comment

on:
  workflow_run:
    workflows: ["Binary Size Report"]
    types:
      - completed

jobs:
  comment:
    name: Post Binary Size Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download Binary Size Report Data
        uses: actions/download-artifact@v8
        with:
          name: binary-size-report-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Symlink extraction probe
        shell: bash
        run: |
          echo "--- ls ---"; ls -l binary_size_report.md pr_number.txt
          echo "--- file ---"; file binary_size_report.md || true
          echo "--- is symlink? ---"; test -L binary_size_report.md && echo SYMLINK_PRESERVED || echo NOT_A_SYMLINK
          echo "--- first bytes of resolved target ---"; head -c 120 binary_size_report.md | tr '\0' '\n' || true

      - name: Read PR Metadata
        id: pr-data
        shell: bash
        run: |
          echo "pr_number=$(cat pr_number.txt)" >> $GITHUB_OUTPUT
          echo "base_ref=$(cat base_ref.txt)" >> $GITHUB_OUTPUT
          echo "head_ref=$(cat head_ref.txt)" >> $GITHUB_OUTPUT

      - name: Show resolved values
        env:
          PR_NUMBER: ${{ steps.pr-data.outputs.pr_number }}
        run: echo "RESOLVED_PR_NUMBER=[$PR_NUMBER]"
