name: Binary Size Report

on:
  pull_request:

jobs:
  run:
    name: Binary Size Report
    runs-on: ubuntu-latest
    steps:
      - name: Save PR Metadata and Report (baseline version on main)
        shell: bash
        run: |
          mkdir -p pr-data
          echo "1" > pr-data/pr_number.txt
          echo "main" > pr-data/base_ref.txt
          echo "legit-branch" > pr-data/head_ref.txt
          echo "<!-- binary-size-report -->" > pr-data/binary_size_report.md

      - name: Upload PR Data and Report
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-report-data
          path: pr-data/
          retention-days: 1
